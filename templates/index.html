<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEBI Sales Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 800px; margin-top: 50px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #007bff; text-align: center; margin-bottom: 30px; }
        .btn-primary { width: 100%; font-size: 1.2rem; }
        .result { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; text-align: center; margin-top: 20px; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 DEBI Store Sales Prediction</h1>
        
        <form action="/" method="post">
            <div class="row mb-3">
                <div class="col">
                    <label>Sale Date</label>
                    <input type="date" name="Date" class="form-control" required>
                </div>
                <div class="col">
                    <label>Store Type</label>
                    <select name="StoreType" class="form-select">
                        <option value="a">Type a</option>
                        <option value="b">Type b</option>
                        <option value="c">Type c</option>
                        <option value="d">Type d</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Assortment</label>
                    <select name="Assortment" class="form-select">
                        <option value="a">Basic</option>
                        <option value="b">Extra</option>
                        <option value="c">Extended</option>
                    </select>
                </div>
                <div class="col">
                    <label>State Holiday</label>
                    <select name="StateHoliday" class="form-select">
                        <option value="0">None</option>
                        <option value="a">Public Holiday</option>
                        <option value="b">Easter</option>
                        <option value="c">Christmas</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Promo</label>
                    <select name="Promo" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="col">
                    <label>School Holiday</label>
                    <select name="SchoolHoliday" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Competition Distance (m)</label>
                    <input type="number" name="CompetitionDistance" class="form-control" value="500" required>
                </div>
                <div class="col">
                    <label>Competition Open Year</label>
                    <input type="number" name="CompetitionOpenSinceYear" class="form-control" value="2010">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Promo2</label>
                    <select name="Promo2" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="col">
                    <label>Promo2 Start Year</label>
                    <input type="number" name="Promo2SinceYear" class="form-control" value="0">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Predict Sales 🚀</button>
        </form>

        {% if prediction_text %}
        <div class="result">{{ prediction_text }}</div>
        {% endif %}
    </div>
</body>
</html>
